name: CI/CD Pipeline

# Tentukan kapan workflow ini dijalankan (misal: setiap ada push ke branch main atau master)
on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari repository GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment untuk menjalankan test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Install dependencies dan jalankan test
      - name: Install Dependencies & Run Tests
        run: |
          npm install
          npm test

      # 4. Set up Docker Buildx (untuk proses build container)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build Docker Image untuk memastikan Dockerfile Anda valid dan bebas error
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set ke true jika ingin otomatis push ke Docker Hub (opsional)
          tags: taskeasy-app:latest
